        .poet-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.6); border-radius: 20px; overflow: hidden; box-shadow: 0 15px 50px rgba(0,0,0,0.05); margin-bottom: 30px; }

        .poems-box::before { content: '❝'; position: absolute; top: -15px; left: 20px; font-size: 2.5rem; color: var(--vermilion); opacity: 0.2; font-family: Georgia, serif; }

<body>
    <div class="bg-base"></div>

    <div class="container">

            <h1 class="main-title">测测你在古代是哪位诗人？</h1>

            <div class="poem-quote">君不见黄河之水天上来，奔流到海不复回。<br>君不见高堂明镜悲白发，朝如青丝暮成雪。<br>人生得意须尽欢，莫使金樽空对月。<br>天生我材必有用，千金散尽还复来。<span class="poem-author">——李白《将进酒》</span></div>

    </div>

    <script>
        const poets = [
            { name: "李白", code: "LB-WILD", avatar: "images/LB-WILD.jpg", coordinate: [-5, -10, +8, +10], tags: ["先天反骨圣体", "职场整顿者"], description: "你骨子里有不服输的劲儿，讨厌规则束缚，喜欢自由奔放的生活。你不适合朝九晚五，适合诗和远方。", poems: ["天生我材必有用，千金散尽还复来", "仰天大笑出门去，我辈岂是蓬蒿人", "安能摧眉折腰事权贵，使我不得开心颜"], bio: "李白（701-762），号青莲居士，唐代伟大的浪漫主义诗人。一生追求自由，蔑视权贵，传说他醉酒后为捞水中月亮而溺亡，如此浪漫的结局再适合他不过。", personality: ["浪漫主义", "狂放不羁", "追求自由", "蔑视权贵", "才华横溢"], representativeLines: ["床前明月光，疑是地上霜", "举杯邀明月，对影成三人", "长风破浪会有时，直挂云帆济沧海"], matchReason: "你和李白一样，骨子里有一种不服输的劲头。你们都讨厌被规则束缚，喜欢追求自由，遇到困难选择迎难而上。", message: "愿君胸藏星斗，身寄烟霞；逸气凌云，狂怀自适。顺境则纵酒长歌，逆境亦乘风独往，不负山河，不负初心。" },
            { name: "杜甫", code: "DF-EMO", avatar: "images/DF-EMO.jpg", coordinate: [+9, +7, -10, -2], tags: ["重度内耗专家", "操心命"], description: "你是个典型的操心命，永远在为还没发生的事担忧。你的人生关键词是'万一'和'但是'。", poems: ["国破山河在，城春草木深", "朱门酒肉臭，路有冻死骨", "安得广厦千万间，大庇天下寒士俱欢颜"], bio: "杜甫（712-770），字子美，唐代现实主义诗人。他经历安史之乱，颠沛流离，即使茅屋被秋风吹破，还在想着'大庇天下寒士'。", personality: ["忧国忧民", "内耗严重", "责任心强", "现实主义", "情感细腻"], representativeLines: ["烽火连三月，家书抵万金", "白日放歌须纵酒，青春作伴好还乡", "无边落木萧萧下，不尽长江滚滚来"], matchReason: "总是操心太多、内耗太重。这种性格让你成为朋友眼中最靠谱的人，但有时候也让你活得太累。学会放过自己吧。", message: "愿君常怀悲悯，心存苍生；历世沧桑，不改赤诚。肩担道义，怀藏温良，浮沉之间，风骨长存。" },
            { name: "苏轼", code: "SS-CHILL", avatar: "images/SS-CHILL.jpg", coordinate: [-2, -6, +10, +8], tags: ["顶级乐天派", "荒野美食家"], description: "你是朋友圈里的开心果，无论什么糟心事到你这儿都能变成段子。被贬到哪都能活成度假。", poems: ["但愿人长久，千里共婵娟", "竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生", "大江东去，浪淘尽，千古风流人物"], bio: "苏轼（1037-1101），号东坡居士。一生不是在被贬，就是在去被贬的路上，但他发明了东坡肉，写下了《赤壁赋》。苦中作乐的能力，堪称历史第一。", personality: ["乐观豁达", "美食达人", "随遇而安", "才华全面", "社交达人"], representativeLines: ["春宵一刻值千金，花有清香月有阴", "不识庐山真面目，只缘身在此山中", "欲把西湖比西子，淡妆浓抹总相宜"], matchReason: "令人羡慕的乐天心态是你的最大特质。无论遭遇什么困境，你相信一切都是最好的安排，这种心态值得所有人学习。", message: "愿君历经风雨，心自澄明。宠辱不惊，得失随缘；可入世济俗，可出世安闲，一蓑烟雨，终生从容。" },
            { name: "王维", code: "WW-ZEN", avatar: "images/WW-ZEN.jpg", coordinate: [-9, +4, +3, -9], tags: ["佛系青年", "大厂裸辞隐居者"], description: "你的人生信条是'躺平'，拒绝内卷，崇尚自然。别人挤破头抢的东西，你微微一笑：'无所谓。'", poems: ["行到水穷处，坐看云起时", "大漠孤烟直，长河落日圆", "独坐幽篁里，弹琴复长啸"], bio: "王维（701-761），号摩诘居士。他年少成名，在朝中做过大官，却在盛年选择隐居终南山。半官半隐，既有诗和远方，也有面包和存款。", personality: ["佛系淡定", "追求宁静", "艺术修养高", "向往自然", "内心富足"], representativeLines: ["渭城朝雨浥轻尘，客舍青青柳色新", "深林人不知，明月来相照", "返景入深林，复照青苔上"], matchReason: "真正的佛系青年。你向往宁静致远的生活，追求内心的平静而非外在的喧嚣。不是躺平，而是另一种形式的优雅生活。", message: "愿君心藏丘壑，胸隐林泉。处尘嚣而守清寂，居俗世而慕云山；静观云舒，安守本心，恬淡自渡。" },
            { name: "李清照", code: "LQZ-SASS", avatar: "images/LQZ-SASS.jpg", coordinate: [+1, -8, -6, +6], tags: ["千古第一拽姐", "清醒独立大女主"], description: "你是那种'人间清醒'型选手，感情上不将就，事业上有主见。谁说女子不如男？", poems: ["寻寻觅觅，冷冷清清，凄凄惨惨戚戚", "生当作人杰，死亦为鬼雄", "知否知否？应是绿肥红瘦"], bio: "李清照（1084-1155），宋代女词人。她经历了丧夫、流亡，在那个年代，她喝酒、打牌、写文章，活成了最拽的大女主。", personality: ["独立清醒", "才华横溢", "敢爱敢恨", "情感丰富", "品味高雅"], representativeLines: ["莫道不销魂，帘卷西风，人比黄花瘦", "此情无计可消除，才下眉头，却上心头", "花自飘零水自流，一种相思，两处闲愁"], matchReason: "清醒大女主。在感情上不将就，在生活中有主见。无论男女，都应该活出自己的精彩，你的价值由你自己定义。", message: "愿君才情立身，傲骨自持。谙风月之柔，具孤高之节；离合不惊，悲欢自渡，芳华不负，岁月安然。" },
            { name: "辛弃疾", code: "XQJ-FIGHT", avatar: "images/XQJ-FIGHT.jpg", coordinate: [+10, -3, -4, +7], tags: ["武德充沛", "六边形狂战士"], description: "你是个全能选手，文能提笔安天下，武能马上定乾坤。别人只会一样，你偏偏样样都行。", poems: ["众里寻他千百度，蓦然回首，那人却在灯火阑珊处", "醉里挑灯看剑，梦回吹角连营", "想当年，金戈铁马，气吞万里如虎"], bio: "辛弃疾（1140-1207），南宋豪放派词人。他本是抗金将领，率领过起义。文武双全，六边形战士。", personality: ["全能型", "抗压能力强", "理想主义者", "热血爱国", "多才多艺"], representativeLines: ["天下英雄谁敌手？曹刘", "青山遮不住，毕竟东流去", "少年不识愁滋味，爱上层楼"], matchReason: "你是不肯服输的六边形战士。不满足于平庸，即使现实一次次打击你，也会站起来继续战斗。", message: "愿君怀凌云壮志，存赤胆孤忠。胸有家国意气，身含傲骨锋芒；纵壮志难伸，热血终不凉。" },
            { name: "白居易", code: "BJY-WORK", avatar: "images/BJY-WORK.jpg", coordinate: [+8, +6, +2, +9], tags: ["现实主义打工人", "KPI狂魔"], description: "你是工作狂本狂，相信只要努力就一定有回报。你的座右铭是'在其位谋其政'。", poems: ["同是天涯沦落人，相逢何必曾相识", "离离原上草，一岁一枯荣", "千呼万唤始出来，犹抱琵琶半遮面"], bio: "白居易（772-846），唐代现实主义诗人。读书读到口生疮，写字写到手磨出茧。他的诗追求通俗易懂，连老奶奶都能听懂。", personality: ["勤勉务实", "接地气", "亲民", "有责任心", "才华与努力并存"], representativeLines: ["野火烧不尽，春风吹又生", "日出江花红胜火，春来江水绿如蓝", "来如春梦几多时？去似朝云无觅处"], matchReason: "相信一分耕耘一分收获，在职场上是妥妥的KPI狂魔。这种脚踏实地的人生态度，是你最大的魅力所在。", message: "愿君守本存真，安度流年。阅尽世情纷扰，常怀仁厚温良；顺世而不随俗，自持一片天真。" },
            { name: "李商隐", code: "LSY-BE", avatar: "images/LSY-BE.jpg", coordinate: [+3, +5, -9, -4], tags: ["BE美学大师", "究极谜语人"], description: "你是个emo大师，说什么都喜欢绕来绕去。别人问你在干嘛，你说'在高堂明镜悲白发'。", poems: ["春蚕到死丝方尽，蜡炬成灰泪始干", "此情可待成追忆，只是当时已惘然", "身无彩凤双飞翼，心有灵犀一点通"], bio: "李商隐（约813-858），晚唐诗人。他的一生充满谜团，仕途坎坷。他的诗晦涩难懂，却美得让人心碎。", personality: ["emo达人", "含蓄内敛", "情感深沉", "才华出众", "命运多舛"], representativeLines: ["何当共剪西窗烛，却话巴山夜雨时", "夕阳无限好，只是近黄昏", "直道相思了无益，未妨惆怅是清狂"], matchReason: "你不擅长直接表达感情，却能用最含蓄的方式让人心动。你相信真正的感情应该是执着的，这就是你浪漫的方式。", message: "愿君情藏方寸，憾付流年。懂风月之怅，明尘世之常；勿执过往执念，深情自有归处。" },
            { name: "陶渊明", code: "TYM-FARM", avatar: "images/TYM-FARM.jpg", coordinate: [-10, -7, +6, -6], tags: ["归隐区UP主", "拒绝内卷第一人"], description: "你是躺平界的祖师爷，早在一千多年前就开创了'田园牧歌'式生活。别人挤都市，你种菜。", poems: ["采菊东篱下，悠然见南山", "种豆南山下，草盛豆苗稀", "羁鸟恋旧林，池鱼思故渊"], bio: "陶渊明（365-427），东晋诗人。他当了十三年的官，又辞职回家种了二十三年的地。用一生诠释了不愿同流合污的傲骨。", personality: ["淡泊名利", "崇尚自然", "傲骨铮铮", "生活简单", "精神独立"], representativeLines: ["桃花源记（节选）", "山气日夕佳，飞鸟相与还", "衣沾不足惜，但使愿无违"], matchReason: "你有一颗向往自由的心，不愿被世俗的规则束缚。在这个人人都在焦虑的时代，你选择了慢下来。", message: "愿君抛尘俗纷竞，归心田园。弃浮名荣辱，守闲逸本真；随心安度，淡泊无争，悠然自适。" },
            { name: "柳宗元", code: "LZY-ALONE", avatar: "images/LZY-ALONE.jpg", coordinate: [-3, +4, -8, -10], tags: ["孤寡老人", "独自美丽"], description: "你是独处爱好者，享受一个人的时光。别人觉得孤独，你觉得那是自由。", poems: ["千山鸟飞绝，万径人踪灭", "孤舟蓑笠翁，独钓寒江雪", "惊风乱飐芙蓉水，密雨斜侵薜荔墙"], bio: "柳宗元（773-819），唐代文学家。被贬永州十年，在孤独的岁月里，写出了中国文学史上最孤独也最美丽的文字。", personality: ["享受孤独", "才华内敛", "坚韧隐忍", "独立思考", "文学造诣深"], representativeLines: ["烟销日出不见人，欸乃一声山水绿", "回看天际下中流，岩上无心云相逐", "山城过雨百花尽，榕叶满庭莺乱啼"], matchReason: "懂得享受独处的时光。你不需要热闹来填满生活，在孤独中反而能更清楚地认识自己，独自美丽的你不需要别人的认可。", message: "愿君历尽风霜，素心不改。遭世事坎坷，仍存青云之志；静以自愈，敛而自修，风骨长青。" },
            { name: "陆游", code: "LY-CAT", avatar: "images/LY-CAT.jpg", coordinate: [+8, +2, -5, -1], tags: ["重度猫奴", "意难平老兵"], description: "你是个爱国青年，有报国之志却郁郁不得志。但你还有个爱好——撸猫。", poems: ["王师北定中原日，家祭无忘告乃翁", "山重水复疑无路，柳暗花明又一村", "零落成泥碾作尘，只有香如故"], bio: "陆游（1125-1210），南宋爱国诗人。一生都在盼着收复中原。但他有个秘密爱好——写诗夸自己的猫，妥妥的猫奴语录。", personality: ["爱国情怀", "意志坚定", "内心柔软", "才华横溢", "情感细腻"], representativeLines: ["纸上得来终觉浅，绝知此事要躬行", "夜阑卧听风吹雨，铁马冰河入梦来", "何方可化身千亿，一树梅前一放翁"], matchReason: "有着深沉的情怀，同时也有一颗柔软的心。嘴上说着家国天下，心里却惦记着猫。外刚内柔，既可靠又有趣。", message: "愿君常怀热忱，不负平生。怀家国之思，存风月之情；岁月流转，赤心如故，不负韶华，不负己身。" },
            { name: "曹操", code: "CC-BOSS", avatar: "images/CC-BOSS.jpg", coordinate: [+10, -4, +4, +10], tags: ["霸道总裁", "乱世枭雄"], description: "你天生就是当领导的料，有魄力、有手段、有魅力。跟着你干的人都服你。", poems: ["对酒当歌，人生几何", "何以解忧？唯有杜康", "老骥伏枥，志在千里"], bio: "曹操（155-220），东汉末年枭雄。他挟天子以令诸侯，统一北方。他是奸雄，也是英雄；是诗人，也是军事家。", personality: ["霸气外露", "领导力强", "务实果断", "知人善任", "格局宏大"], representativeLines: ["日月之行，若出其中", "星汉灿烂，若出其里", "烈士暮年，壮心不已"], matchReason: "你不甘于平庸，总想着干一番大事业。有眼光、有魄力、敢担当，是那种能带领团队走向胜利的人。", message: "愿君胸怀寰宇，气蕴风雷。有经世之格局，有逆势之胆魄；行事果决，城府深藏，破浪乘风，终成远志。" },
            { name: "孟浩然", code: "MHR-FLAT", avatar: "images/MHR-FLAT.jpg", coordinate: [-8, -5, +2, -3], tags: ["躺平鼻祖", "社交漏斗"], description: "你是朋友圈里最佛的那个，约你吃饭永远说'再说吧'。但你的精神状态领先世界一千年。", poems: ["春眠不觉晓，处处闻啼鸟", "夜来风雨声，花落知多少", "气蒸云梦泽，波撼岳阳城"], bio: "孟浩然（689-740），唐代山水田园诗派先驱。在唐朝这个所有人都削尖脑袋往上爬的时代，他选择回家种田。", personality: ["极度佛系", "不慕荣利", "热爱自然", "社恐本恐", "内心平静"], representativeLines: ["开轩面场圃，把酒话桑麻", "待到重阳日，还来就菊花", "移舟泊烟渚，日暮客愁新"], matchReason: "在所有人都拼命内卷的时候，你选择了躺平。这是一种看透人生后的豁达。佛系，是最高级的生活哲学。", message: "愿君随性安时，不逐浮华。耽山水清趣，远车马喧嚣；寡欲无争，栖心闲寂，静享人间清欢。" },
            { name: "贺知章", code: "HZZ-SOCIAL", avatar: "images/HZZ-SOCIAL.jpg", coordinate: [-1, -2, +9, +10], tags: ["四明狂客", "退休社牛老翁"], description: "你是社交天花板，跟谁都能聊得来。退休生活比上班还精彩，天天约饭局。", poems: ["不知细叶谁裁出，二月春风似剪刀", "少小离家老大回，乡音无改鬓毛衰", "唯有门前镜湖水，春风不改旧时波"], bio: "贺知章（约659-744），唐代诗人中长寿的代表。在朝中做了五十多年官，他还一手发掘了李白，社交牛人实锤。", personality: ["社交牛人", "乐观开朗", "善于发现人才", "心态年轻", "人脉广泛"], representativeLines: ["碧玉妆成一树高，万条垂下绿丝绦", "离别家乡岁月多，近来人事半消磨", "儿童相见不相识，笑问客从何处来"], matchReason: "天生的社交达人。人脉广、心态好。你总能用幽默化解尴尬，用热情感染身边的人。跟你在一起永远不无聊。", message: "愿君通透达观，葆赤子之心。阅尽世态，深谙人情，而不流于圆滑；岁月加身，眉眼犹温，初心未改。" },
            { name: "杜牧", code: "DM-PLAY", avatar: "images/DM-PLAY.jpg", coordinate: [+5, -7, +5, +9], tags: ["风流才子", "夜店小王子"], description: "你是派对动物，爱热闹、爱美酒、爱美人。及时行乐是你的人生信条。", poems: ["清明时节雨纷纷，路上行人欲断魂", "商女不知亡国恨，隔江犹唱后庭花", "停车坐爱枫林晚，霜叶红于二月花"], bio: "杜牧（803-852），晚唐诗人。出身名门，才华横溢，把满腔热情投入到了寻欢作乐。'十年一觉扬州梦'说的就是他。", personality: ["风流倜傥", "及时行乐", "才华横溢", "讽刺现实", "浪漫不羁"], representativeLines: ["借问酒家何处有，牧童遥指杏花村", "千里莺啼绿映红，水村山郭酒旗风", "天阶夜色凉如水，卧看牵牛织女星"], matchReason: "骨子里有一种及时行乐的洒脱。相信人生苦短，应该尽情享受。这让你成为朋友圈的气氛担当。", message: "愿君才情蕴骨，清醒自持。览尽繁华风月，进退有度；风流而不放纵，温雅而有棱。" },
            { name: "王安石", code: "WAS-RULE", avatar: "images/WAS-RULE.jpg", coordinate: [+10, +10, -2, +3], tags: ["铁腕卷王", "变法狂人"], description: "你是卷王本王，工作狂到没朋友。你信奉'要么不做，要么做到极致'。", poems: ["春风又绿江南岸，明月何时照我还", "不畏浮云遮望眼，自缘身在最高层", "千门万户曈曈日，总把新桃换旧符"], bio: "王安石（1021-1086），北宋政治家。他发动了著名的变法，那份'天变不足畏，祖宗不足法，人言不足恤'的勇气让人敬佩。", personality: ["意志坚定", "改革创新", "工作狂魔", "目标导向", "不受干扰"], representativeLines: ["飞来峰上千寻塔，闻说鸡鸣见日升", "自古驱民在信诚，一言为重百金轻", "爆竹声中一岁除，春风送暖入屠苏"], matchReason: "不服输的卷王。有远大的理想，只要认定了目标，就会一往无前。跟着你干事业绝对靠谱。", message: "愿君志存高远，守道不移。怀革故之魄力，秉持正之恒心；不徇世俗非议，固守心中正道。" },
            { name: "鱼玄机", code: "YXJ-FREE", avatar: "images/YXJ-FREE.jpg", coordinate: [+2, -10, -4, +8], tags: ["先锋女性", "精神独立者"], description: "你是那个年代的女性先驱，不愿依附任何人，活出了自己的精彩。", poems: ["易求无价宝，难得有情郎", "羞日遮罗袖，愁春懒起妆", "自能窥宋玉，何必恨王昌"], bio: "鱼玄机（约844-872），唐代女诗人。在那个女子大门不出二门不迈的年代，她开道观、收女弟子，活成了最叛逆的样子。", personality: ["追求独立", "敢爱敢恨", "才情出众", "反抗命运", "敢为人先"], representativeLines: ["枕上潜垂泪，花间暗断肠", "忆君心似西江水，日夜东流无歇时", "春来秋去相思在，秋去春来信息违"], matchReason: "继承了她的独立与勇敢。不愿依附任何人，要用自己的双手创造属于自己的人生，精神值得敬佩。", message: "愿君破世俗之樊笼，立己身之风骨。才情藏怀，傲骨立身；不为俗规所拘，随心自立，自爱自持。" },
            { name: "屈原", code: "QY-SAD", avatar: "images/QY-SAD.jpg", coordinate: [+6, +8, -10, +1], tags: ["究极理想主义", "精神洁癖"], description: "你是个完美主义者，眼里容不得沙子。在你这里，妥协是不存在的。", poems: ["路漫漫其修远兮，吾将上下而求索", "举世皆浊我独清，众人皆醉我独醒", "长太息以掩涕兮，哀民生之多艰"], bio: "屈原（约前340-278），战国诗人。一心想要振兴楚国，却遭陷害流放。眼看国破，抱石投江，是中国第一位伟大的爱国诗人。", personality: ["理想主义者", "宁折不弯", "爱国忠臣", "精神洁癖", "才华盖世"], representativeLines: ["亦余心之所善兮，虽九死其犹未悔", "袅袅兮秋风，洞庭波兮木叶下", "鸟飞反故乡兮，狐死必首丘"], matchReason: "骨子里有理想主义和精神洁癖。不愿同流合污，坚守自己的原则。这种孤高的精神，是你最动人的地方。", message: "愿君志行高洁，守魂如玉。宁孤清而秉素志，不随流而污清名；怀家国之诚，秉澄澈之节。" },
            { name: "纳兰性德", code: "NL-LOVE", avatar: "images/NL-LOVE.jpg", coordinate: [-2, +6, -9, -7], tags: ["纯爱战神", "抑郁贵公子"], description: "你是深情本人，谈个恋爱能写一百首词。虽然情路坎坷，但你从不将就。", poems: ["人生若只如初见，何事秋风悲画扇", "被酒莫惊春睡重，赌书消得泼茶香", "当时只道是寻常"], bio: "纳兰性德（1655-1685），清代词人。出身显赫，却是个深度恋爱脑。悼念亡妻的词写得肝肠寸断，可惜天妒英才。", personality: ["深情专一", "感性细腻", "出身高贵", "才华横溢", "英年早逝"], representativeLines: ["一生一代一双人，争教两处销魂", "我是人间惆怅客，知君何事泪纵横", "背灯和月就花阴，已是十年踪迹十年心"], matchReason: "在这个人人都说着'智者不入爱河'的年代，你依然相信爱情。你的不将就，让你活出了最真实的自己。", message: "愿君深谙情味，能释前尘。心秉温良，性含幽思；勿困执念，勿恋过往，余生安渡，风月无伤。" },
            { name: "岑参", code: "CS-HARD", avatar: "images/CS-HARD.jpg", coordinate: [+9, -2, +4, +5], tags: ["边塞特种兵", "极限运动爱好者"], description: "你是冒险家，待在舒适区会死。总想去看更大的世界，体验更刺激的人生。", poems: ["忽如一夜春风来，千树万树梨花开", "北风卷地白草折，胡天八月即飞雪", "马上相逢无纸笔，凭君传语报平安"], bio: "岑参（约715-770），唐代边塞诗人。别人写边塞靠想象，他写全是亲身经历。他是诗人里少有的硬汉，特种兵诗人。", personality: ["热爱冒险", "勇于探索", "意志坚强", "见识广博", "性格豪爽"], representativeLines: ["古来青史谁不见，今见功名胜古人", "今夜不知何处宿，万里敦煌使人愁", "丈夫贫贱应未足，今日相逢无酒钱"], matchReason: "不愿待在舒适区，总想体验更刺激的人生。别人觉得苦的地方你觉得刺激，这种不安分的心，是你保持年轻的秘诀。", message: "愿君胸揽山河，不惧风霜。怀大漠之豪情，负四方之远志；纵使前路迢递，亦可策马乘风，奔赴远方。" }
        ];

        const questions = [
            { title: "周日晚上 22:30，你正躺在床上刷视频，老板突然在群里艾特所有人发了一个 60MB 的方案文档：", options: [ { text: "假装已经睡着。只要我装得够像，周一之前的我就不存在。", scores: [-1, -2, 0, -1] }, { text: "瞬间心率飙升，反复点开又关掉，脑子里已经开始构思怎么改了。", scores: [+1, +1, -2, 0] }, { text: "秒回“收到”，并立刻在脑海里盘算明天怎么把这活儿拆分出去。", scores: [+2, +1, 0, +1] }, { text: "截图发给闺蜜/兄弟吐槽：“看，活爹又发作了”，然后继续刷视频。", scores: [0, -1, +1, +1] } ] },
            { title: "如果你买彩票意外中了 5000 万，但兑奖的附加条件是必须去一个没有 Wi-Fi 的深山老林里住满五年：", options: [ { text: "还有这种好事？拿钱还能名正言顺逃避社交，现在就出发。", scores: [-2, 0, +1, -2] }, { text: "能带朋友去吗？我出钱把山头包下来，办五年的森林派对！", scores: [0, -1, +2, +2] }, { text: "五年太长了，这会让我完全脱离社会轨道和核心信息圈，我得考虑下。", scores: [+2, +1, -1, 0] }, { text: "先拿钱，然后用钱在山里雇人拉一条专线光纤，规矩是死的人是活的。", scores: [+1, -2, +1, 0] } ] },
            { title: "在群里疯狂吐槽某个讨厌的客户/老师，按发送后才发现，你发错群了，而且已经过了 2 分钟撤回时限：", options: [ { text: "原地石化，感觉天塌了，甚至已经在构思离职/退学报告。", scores: [0, +1, -2, -1] }, { text: "火速编造一个借口：“不好意思大家，刚才号被盗了/朋友恶作剧！”", scores: [+1, +1, 0, +1] }, { text: "立刻退群，把手机关机，只要我不看，社死就追不上我。", scores: [-1, -2, 0, -2] }, { text: "发一个极其搞笑的表情包强行圆场：“测试一下大家在不在，气氛活跃完毕~”", scores: [0, -1, +2, +2] } ] },
            { title: "在一个必须出席的百人大型聚餐上，所有人都在虚伪地互相敬酒，而你的“社交电量”已经耗尽：", options: [ { text: "找借口去洗手间，然后在马桶上坐了半个小时玩手机。", scores: [-1, 0, 0, -2] }, { text: "挂上无懈可击的职业微笑，继续完成必要的社交 KPI。", scores: [+2, +1, -1, +1] }, { text: "找到角落里另一个看起来同样社恐的人，两人用眼神达成默契的结盟。", scores: [0, 0, +1, -1] }, { text: "突然站起来端起杯子：“我敬大家一杯，喝完我先干为敬撤了！”试图强行快进。", scores: [+1, -2, +1, +2] } ] },
            { title: "你熬了三个通宵写出来的方案，被领导评价为“缺乏互联网思维和底层逻辑的赋能”，你会：", options: [ { text: "表面连连点头说“您教训得对”，回去边骂边熬第四个通宵改。", scores: [+1, +2, -1, 0] }, { text: "直接冷脸把文件扔进回收站：既然你不懂欣赏，那我换一家懂的公司。", scores: [-1, -2, 0, 0] }, { text: "陷入深度的自我怀疑，觉得这世界终究没人能懂自己的才华。", scores: [0, 0, -2, -1] }, { text: "当场开始用更高级的黑话和领导辩论，试图在理论上压倒对方。", scores: [+2, -1, 0, +2] } ] },
            { title: "公司/学校宣布，本周六全体成员必须参加一场没有任何补贴的“荒野求生”团建：", options: [ { text: "背上一大包零食，把这当成一次免费的公费野餐，疯狂蹭吃蹭喝。", scores: [0, 0, +2, +1] }, { text: "极度反感，直接找借口请病假。周末时间神圣不可侵犯。", scores: [-1, -2, 0, -1] }, { text: "准时参加但全程戴着降噪耳机，肉体在团建，灵魂已出窍。", scores: [0, +1, -1, -2] }, { text: "积极担当组长，争取在团建里给领导留下深刻印象，顺便扩展人脉。", scores: [+2, +1, 0, +2] } ] },
            { title: "收拾房间时，你意外翻出了自己初中时写的中二日记本，翻开第一页：", options: [ { text: "哈哈大笑，直接拍照发朋友圈公开处刑自己的黑历史。", scores: [0, -1, +2, +2] }, { text: "看着那些文字，突然一阵伤感，感叹时光飞逝，青春不再。", scores: [0, 0, -2, -1] }, { text: "立刻找个打火机烧掉或者扔进碎纸机，这种东西绝对不能留存于世。", scores: [+1, +2, 0, -1] }, { text: "认真看完，觉得里面的某些脑洞还挺有意思，留着当以后的创作素材。", scores: [+1, 0, +1, 0] } ] },
            { title: "你正在进行极其重要的线上会议汇报，你养的猫突然跳上键盘，踩出了一大串乱码发在公屏上：", options: [ { text: "瞬间慌乱，疯狂道歉，觉得自己的专业形象彻底毁于一旦。", scores: [0, +1, -2, -1] }, { text: "举起猫怼向摄像头：“给大家介绍一下，这是我今天请来的联合汇报人。”", scores: [0, -1, +2, +2] }, { text: "面无表情地把猫挪开，删掉乱码，接着刚才的话茬继续讲，仿佛无事发生。", scores: [+2, +2, 0, 0] }, { text: "直接把摄像头关了，假装网卡了，在屏幕后无能狂怒。", scores: [-1, 0, -1, -2] } ] },
            { title: "在小组讨论中，一个同事/同学巧妙地把你的创意包装成了他自己的功劳，你的反应是：", options: [ { text: "立刻在会上优雅地打断，补充细节，把主导权不动声色地抢回来。", scores: [+2, +1, 0, +1] }, { text: "当面不说，但回去后写一封条理清晰、抄送所有领导的复盘邮件说明情况。", scores: [+1, +2, -1, 0] }, { text: "一拍桌子当场对峙，管他什么场合，让我受委屈不行。", scores: [0, -2, 0, +1] }, { text: "算了，心累，这种破环境不配拥有我，已经在看新机会了。", scores: [-2, -1, 0, -1] } ] },
            { title: "如果必须给你的社交软件设置一个长期的个人状态，最符合你的一句是：", options: [ { text: "“24小时在线，有问题随时滴我。”", scores: [+2, +1, 0, +2] }, { text: "“间歇性精神满格，持续性混吃等死。”", scores: [-1, -1, +2, 0] }, { text: "“深度思考中，非十万火急勿扰。”", scores: [0, +1, -1, -2] }, { text: "“本人已注销，有事请烧纸。”", scores: [-2, -2, +1, -1] } ] },
            { title: "你刚通宵熬完一个巨大且折磨人的项目，按下提交键的那一刻，你的第一反应是：", options: [ { text: "必须叫上几个好朋友去吃顿最贵的火锅，不醉不归！", scores: [0, 0, +2, +2] }, { text: "把手机设为飞行模式，拉上窗帘，准备睡它个昏天黑地。", scores: [-1, 0, 0, -2] }, { text: "趁着记忆热乎，立刻把项目经验整理进自己的作品集/简历里。", scores: [+2, +2, 0, 0] }, { text: "看着电脑屏幕，突然感到一种深深的空虚：这么拼命到底图什么？", scores: [0, 0, -2, -1] } ] },
            { title: "互联网上突然爆出一个惊天大瓜（比如明星塌房），你会：", options: [ { text: "化身瓜田里的猹，到处搜集时间线，给各种群友做课代表总结。", scores: [0, -1, +1, +2] }, { text: "看一眼就划走，毫不关心，陌生人的生活与我何干。", scores: [-2, 0, 0, -2] }, { text: "敏锐地分析这个事件背后的公关策略和资本博弈逻辑。", scores: [+2, +1, -1, 0] }, { text: "翻看评论区，看着网友的谩骂，对人性和互联网环境感到悲观。", scores: [0, +1, -2, -1] } ] },

                        // 💡 第二重暴力绞杀：如果它没打标签，直接找最后一个英文字母，切断前面所有废话！
                        let lastEng = -1;
                        for (let i = reply.length - 1; i >= 0; i--) {
                            if (/[a-zA-Z]/.test(reply[i])) { lastEng = i; break; }
                        }
                        if (lastEng !== -1) {
                            // 截取最后一个英文字母之后的内容，并去掉开头的无用符号
                            reply = reply.substring(lastEng + 1).replace(/^[^a-zA-Z\u4e00-\u9fa5]+/, '').trim();
                        }
                    }
                    
                    // 终极清洗：去掉可能残留的星号或孤立的英文字母
                    reply = reply.replace(/\*/g, '').replace(/[a-zA-Z]/g, '').trim();
                    
                    if(!reply) return '（诗人微微一笑，不置可否。）';
                    return reply;
                }
                return '（时空信号微弱，未收到有效回复。）';
                
            } catch (error) {
                clearTimeout(timeoutId);
                return `（网络异常。⚠️ 请确认已【彻底关闭】魔法代理！）`;
            }
        }

        function setChatLoading(isLoading) {
            const sendBtn = document.getElementById('chatSendBtn');
            const input = document.getElementById('chatInput');
            if (isLoading) {
                sendBtn.disabled = true;
                input.disabled = true;
                sendBtn.textContent = '传送中...';
            } else {
                sendBtn.disabled = false;
                input.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const userText = input.value.trim();
            if (!userText || !currentPoetConfig) return;
            addChatMessage('user', userText);
            input.value = '';
            setChatLoading(true);
            try {
                const response = await callGeminiAPI(userText, currentPoetConfig.prompt);
                addChatMessage('ai', response);
            } catch (error) {
                addChatMessage('system', '时空乱流干扰了通讯，请重试。');
            } finally {
                setChatLoading(false);
            }
        }

        function setupChatEventListeners() {
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('chatSendBtn');
            const newBtn = sendBtn.cloneNode(true);
            sendBtn.parentNode.replaceChild(newBtn, sendBtn);
            const newInput = input.cloneNode(true);
            input.parentNode.replaceChild(newInput, input);
            newInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
            });
            newBtn.addEventListener('click', sendChatMessage);
        }
    </script>
</body>
